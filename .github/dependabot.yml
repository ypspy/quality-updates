version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      pip:
        patterns:
          - "*"
    # mcp 2.x removed mcp.server.fastmcp; stay on the 1.x line.
    ignore:
      - dependency-name: "mcp"
        update-types:
          - "version-update:semver-major"
    labels:
      - dependencies
      - python

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns:
          - "*"
    labels:
      - dependencies
      - javascript

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - ci
